# Compose v2 — sem `version:` (atributo obsoleto no Compose Spec).
services:
  # ==========================================
  # BANCO DE DADOS (PostgreSQL)
  # ==========================================
  db:
    image: postgres:15
    container_name: techstore_db
    restart: unless-stopped
    # As credenciais vêm do .env na raiz quando existir; os valores após
    # ":-" são o padrão embutido, então `docker compose up -d` funciona
    # do zero sem nenhum arquivo .env.
    # NOTA: o Postgres tem um único superusuário (POSTGRES_USER), por isso
    # não existe variável de "root" separada como existia no MariaDB.
    environment:
      POSTGRES_DB: ${DB_NAME:-techstore_v2}
      POSTGRES_USER: ${DB_USER:-techstore_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-techstore_password}
    ports:
      # 5434 na máquina host (a 5432 já está com outro projeto: pecusnet_db);
      # 5432 interno — é a porta que o backend usa via db:5432 na rede do compose
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Garante que o banco está totalmente pronto antes de liberar o backend
    healthcheck:
      # $$ escapam a interpolação da compose: a variável é lida DENTRO do container
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================
  # BACKEND (Node.js / Express / Prisma)
  # ==========================================
  backend:
    build: ./backend
    container_name: techstore_backend
    restart: unless-stopped
    ports:
      - "3002:3000"
    # Injeção de variáveis de ambiente e segredos centralizados.
    # Cada ${VAR:-padrão} usa o .env da raiz se existir, senão o padrão —
    # ninguém precisa criar arquivos para rodar o projeto do zero.
    environment:
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-db70787f15dbe42370a438e165894d14371321f491de60fa8bcafcce9693e177}
      - DB_HOST=db
      - DB_USER=${DB_USER:-techstore_user}
      - DB_PASSWORD=${DB_PASSWORD:-techstore_password}
      - DB_NAME=${DB_NAME:-techstore_v2}
      - DB_PORT=5432
      - DATABASE_URL=postgresql://${DB_USER:-techstore_user}:${DB_PASSWORD:-techstore_password}@db:5432/${DB_NAME:-techstore_v2}
    volumes:
      - ./backend:/app
      - /app/node_modules # Impede que os módulos locais do host corrompam o container
    # Só inicia após o banco passar no healthcheck com sucesso
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: ["yarn", "dev"]
    # `links` força o alias/roteamento direto do backend para o db na rede
    # default do Compose (implícito na bridge padrão do projeto).
    links:
      - db

  # ==========================================
  # FRONTEND (Vite / Nginx Proxy)
  # ==========================================
  frontend:
    build: ./frontend
    container_name: techstore_frontend
    restart: unless-stopped
    ports:
      - "3001:8080"
    depends_on:
      - backend

# ==========================================
# VOLUMES
# ==========================================
volumes:
  # pg_data: volume dedicado do Postgres. Nome antigo (db_data) guardava os
  # dados do MariaDB — reutilizá-lo faria o Postgres recusar a inicialização.
  pg_data:
    driver: local