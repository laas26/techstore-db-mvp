# Compose v2 — sem `version:` (atributo obsoleto no Compose Spec).
services:
  # ==========================================
  # BANCO DE DADOS (PostgreSQL)
  # ==========================================
  db:
    image: postgres:15
    container_name: techstore_db
    restart: unless-stopped
    # As credenciais vêm do .env na raiz quando existir; os valores após
    # ":-" são o padrão embutido, então `docker compose up -d` funciona
    # do zero sem nenhum arquivo .env.
    environment:
      POSTGRES_DB: ${DB_NAME:-techstore_v2}
      POSTGRES_USER: ${DB_USER:-techstore_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-techstore_password}
    ports:
      # Exposição limitada ao host para desenvolvimento e diagnóstico.
      - "127.0.0.1:5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Garante que o banco está totalmente pronto antes de liberar o backend
    healthcheck:
      test: 'pg_isready -U $$POSTGRES_USER -d$$POSTGRES_DB'
      interval: 2s      # Checa a cada 2s em vez de 10s
      timeout: 3s       # Resposta rápida se o socket falhar
      retries: 10       # Mais tentativas para compensar o intervalo menor
      start_period: 2s  # Começa a checar em 2s em vez de esperar 20s
    networks:
      - techstore_net

  # ==========================================
  # BACKEND (Node.js / Express / Prisma)
  # ==========================================
  backend:
    build: ./backend
    image: techstore-backend:latest
    container_name: techstore_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    # Injeção de variáveis de ambiente e segredos centralizados.
    # Cada ${VAR:-padrão} usa o .env da raiz se existir, senão o padrão —
    # ninguém precisa criar arquivos para rodar o projeto do zero.
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - LOGIN_RATE_LIMIT=${LOGIN_RATE_LIMIT:-5}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-http://localhost,http://localhost:3001,http://localhost:3002,http://localhost:5173}
      - SEED_ON_START=${SEED_ON_START:-true}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-}
      - SEED_CLIENTE_PASSWORD=${SEED_CLIENTE_PASSWORD:-}
      # Segredo de sessão sem valor literal no versionado: quando vazio, o
      # entrypoint gera um na primeira subida e guarda em arquivo local.
      - JWT_SECRET=${JWT_SECRET:-}
      - DB_HOST=db
      - DB_USER=${DB_USER:-techstore_user}
      - DB_PASSWORD=${DB_PASSWORD:-techstore_password}
      - DB_NAME=${DB_NAME:-techstore_v2}
      - DB_PORT=5432
      - DATABASE_URL=postgresql://${DB_USER:-techstore_user}:${DB_PASSWORD:-techstore_password}@db:5432/${DB_NAME:-techstore_v2}
    volumes:
      - ./backend:/app
      - /app/node_modules # Impede que os módulos locais do host corrompam o container
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Só inicia após o banco passar no healthcheck com sucesso
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: ["yarn", "dev"]
    networks:
      - techstore_net

  # ==========================================
  # FRONTEND (Vite / Nginx Proxy)
  # ==========================================
  frontend:
    build: ./frontend
    image: techstore-frontend:latest
    container_name: techstore_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - techstore_net

# ==========================================
# REDE dedicada dos servicos
# ==========================================
networks:
  techstore_net:
    driver: bridge

# ==========================================
# VOLUMES
# ==========================================
volumes:
  # Volume persistente dos dados do PostgreSQL.
  pg_data:
    driver: local
