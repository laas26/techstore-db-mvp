version: '3.8'

services:
  # ==========================================
  # BANCO DE DADOS (MariaDB)
  # ==========================================
  db:
    image: mariadb:11
    container_name: techstore_db
    restart: unless-stopped
    # As credenciais vêm do .env na raiz quando existir; os valores após
    # ":-" são o padrão embutido, então `docker compose up -d` funciona
    # do zero sem nenhum arquivo .env.
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-techstore_v2}
      MYSQL_USER: ${DB_USER:-techstore_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-techstore_password}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    # Garante que o banco está totalmente pronto antes de liberar o backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================
  # BACKEND (Node.js / Express / Prisma)
  # ==========================================
  backend:
    build: ./backend
    container_name: techstore_backend
    restart: unless-stopped
    ports:
      - "3002:3000"
    # Injeção de variáveis de ambiente e segredos centralizados.
    # Cada ${VAR:-padrão} usa o .env da raiz se existir, senão o padrão —
    # ninguém precisa criar arquivos para rodar o projeto do zero.
    environment:
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-db70787f15dbe42370a438e165894d14371321f491de60fa8bcafcce9693e177}
      - DB_HOST=db
      - DB_USER=${DB_USER:-techstore_user}
      - DB_PASSWORD=${DB_PASSWORD:-techstore_password}
      - DB_NAME=${DB_NAME:-techstore_v2}
      - DB_PORT=3306
      - DATABASE_URL=mysql://${DB_USER:-techstore_user}:${DB_PASSWORD:-techstore_password}@db:3306/${DB_NAME:-techstore_v2}
    volumes:
      - ./backend:/app
      - /app/node_modules # Impede que os módulos locais do host corrompam o container
    # Só inicia após o banco passar no healthcheck com sucesso
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    command: ["yarn", "start"]

  # ==========================================
  # FRONTEND (Vite / Nginx Proxy)
  # ==========================================
  frontend:
    build: ./frontend
    container_name: techstore_frontend
    restart: unless-stopped
    ports:
      - "3001:8080"
    depends_on:
      - backend

# ==========================================
# VOLUMES
# ==========================================
volumes:
  db_data:
    driver: local