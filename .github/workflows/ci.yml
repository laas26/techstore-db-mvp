# CI — validação contínua do MVP TechStore.
#
# O que esta pipeline garante a cada push/PR para a main:
#  - backend e frontend instalam com Yarn de forma reproduzível (--frozen-lockfile);
#  - o esquema Prisma é válido e o bootstrap do banco (db push + seed) funciona;
#  - o frontend passa nos testes unitários e gera o build de produção.
#
# O que é NÃO-bloqueante (continue-on-error) e porquê:
#  - `yarn lint` (ambos): o repo ainda não está 100% conforme ao Biome;
#    tornar o lint bloqueante agora deixaria a pipeline permanentemente vermelha.
#  - `yarn test` do backend: a suíte Jest está em manutenção (falhas de
#    asserção/drift contra a API atual) — corre para dar visibilidade,
#    sem bloquear o merge, até ser corrigida.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # Backend (Node.js + Express + Prisma)
  # ==========================================
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Banco real para validar o bootstrap (db push + seed) e os testes.
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: techstore_v2
          POSTGRES_USER: techstore_user
          POSTGRES_PASSWORD: techstore_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U techstore_user -d techstore_v2"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=20s
    env:
      NODE_ENV: test
      # Segredo fictício — apenas para a CI (nunca usar em produção).
      JWT_SECRET: ci-only-secret-nao-usar-em-producao
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: techstore_user
      DB_PASSWORD: techstore_password
      DB_NAME: techstore_v2
      DATABASE_URL: postgresql://techstore_user:techstore_password@127.0.0.1:5432/techstore_v2
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js 20 com cache Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: backend/yarn.lock

      - name: Instalar dependências (reproduzível)
        run: yarn install --frozen-lockfile

      - name: Validar esquema Prisma
        run: npx prisma validate

      - name: Gerar Prisma Client
        run: npx prisma generate

      # Reproduz o bootstrap do entrypoint.sh contra o PostgreSQL do job.
      - name: Sincronizar esquema (db push)
        run: npx prisma db push --accept-data-loss

      - name: Popular banco (seed idempotente)
        run: yarn seed

      - name: Testes Jest (não-bloqueante — suíte em manutenção)
        run: yarn test
        continue-on-error: true

      - name: Lint Biome (não-bloqueante — repo ainda não conforme)
        run: yarn lint
        continue-on-error: true

  # ==========================================
  # Frontend (React + Vite)
  # ==========================================
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js 20 com cache Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      # --ignore-engines: @testing-library/jest-dom (dev, só testes) declara
      # node>=22; o build Vite não o empacota (mesmo flag do Dockerfile).
      - name: Instalar dependências (reproduzível)
        run: yarn install --frozen-lockfile --ignore-engines

      # NOTA: o script `yarn test` corre o Vitest em modo watch (interativo);
      # na CI é obrigatório o modo `run` para terminar o processo.
      - name: Testes Vitest
        run: yarn vitest run

      - name: Build de produção
        run: yarn build

      - name: Lint Biome (não-bloqueante — repo ainda não conforme)
        run: yarn lint
        continue-on-error: true
